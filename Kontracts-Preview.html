function resolvedRate(packageItem, vehicle) {
  return packageItem.vehicle_rates?.[vehicle.id] || {
    price: packageItem.price + vehicle.price,
    minutes: packageItem.minutes + vehicle.minutes
  };
}

    const s=structuredClone(S.me.shop.settings),p=s.packages[Number(form.dataset.index)];p.vehicle_rates={};
    for(const v of s.vehicles)if(fd.has('custom-'+v.id))p.vehicle_rates[v.id]={price:cents(data['rate-'+v.id]),minutes:Number(data['time-'+v.id])};
    await persistSettings(s);closeModal();await renderPage();return true;
  }
  if(type==='price-rules') {
    const s=structuredClone(S.me.shop.settings);s.deposit_percent=Number(data.deposit_percent);s.tax_basis_points=cents(data.tax_rate);s.prices_reviewed=fd.has('prices_reviewed');
    await persistSettings(s);await renderPage();return true;
  }
  if(type==='price-check') {
    const r=await api('/preview/price',{method:'POST',body:{package_id:data.package_id,vehicle_id:data.vehicle_id,extra_ids:fd.getAll('extra'),zip:S.me.shop.settings.zip_codes[0],condition:'standard'}});
    $('#price-check-result').innerHTML=`<div class="money-lines">${r.lines.map(x=>`<div><span>${e(x.name)}</span><strong>${money(x.amount)}</strong></div>`).join('')}<div><span>Tax</span><strong>${money(r.tax)}</strong></div><div class="total"><span>Customer total</span><strong>${money(r.total)}</strong></div></div><div class="deposit-box"><span>Deposit now</span><strong>${money(r.deposit)}</strong></div><div class="rate-row"><span>Remaining balance</span><strong>${money(r.total-r.deposit)}</strong></div><p class="muted small">${duration(r.minutes)} service + ${r.buffer_minutes} min travel buffer.</p>`;return true;
  }
  if(type==='google-complete') {
    data.accepted_terms=fd.has('accepted_terms');const r=await api('/auth/google/complete',{method:'POST',body:data});S.me={csrf:r.csrf};go(r.redirect);return true;
  }
  if(type==='google-link'||type==='google-unlink') {
    const r=await api('/auth/google/'+(type==='google-link'?'link':'unlink'),{method:'POST',body:{password:data.password}});
    if(r.url)window.__previewAssign(r.url);else{closeModal();toast(r.message);await refreshMe();await renderPage();}return true;
  }
  return false;
}

function safeBrandColor(c,fallback='#144c3b'){return /^#[a-f0-9]{6}$/i.test(c||'')?c:fallback;}
function brandLuminance(c){const v=[1,3,5].map(i=>parseInt(c.slice(i,i+2),16)/255).map(x=>x<=.04045?x/12.92:((x+.055)/1.055)**2.4);return .2126*v[0]+.7152*v[1]+.0722*v[2];}
function brandInk(c){return brandLuminance(c)>.179?'#000000':'#ffffff';}
function brandTint(c,white=.92){return '#'+[1,3,5].map(i=>Math.round(parseInt(c.slice(i,i+2),16)*(1-white)+255*white).toString(16).padStart(2,'0')).join('');}
function brandReadable(c){let result=c;for(let i=0;i<12&&(1.05/(brandLuminance(result)+.05))<4.5;i++)result='#'+[1,3,5].map(j=>Math.round(parseInt(result.slice(j,j+2),16)*.80).toString(16).padStart(2,'0')).join('');return result;}

pan><i>↓</i><span>/book/mikes-detailing</span><span>/book/elite-auto-care</span><span>/book/your-business</span></div><p class="muted small mt16">These are examples, not real customer accounts. Each owner only manages their own workspace. Your original link remains available when a custom domain is connected.</p></aside></div>`;}

p record above.</p><p class="muted small mt16">Until hosting is activated, share your original booking link. No booking records need to move.</p>${d.status==='active'?`<a class="btn mt16" href="https://${e(d.hostname)}" target="_blank" rel="noopener">Open custom booking page ${icon('up')}</a>`:''}<hr><button class="btn danger small" data-action="brand-domain-remove">Disconnect domain</button><p class="muted small mt8">Disconnecting restores your original booking link. Also remove the old DNS and hosting configuration.</p>`:`<form data-form="brand-domain" class="mt24">${field('Booking hostname','hostname','','text','required maxlength="253" placeholder="book.yourbusiness.com" autocomplete="off"')}<p class="muted small mt8">Enter only the hostname, without https:// or a path.</p><div class="form-footer"><button class="btn primary" type="submit">Add domain</button></div></form>`}</section><aside class="card card-pad"><h3>Start simple.</h3><p class="muted mt16">Your /book/name link already gives you an individual, branded page. A custom domain is optional and requires extra hosting setup.</p><p class="muted small mt16">The software includes ownership verification and domain-specific routing, not automatic purchase of domains or unlimited hosting-provider domain slots.</p><p class="muted small mt16">Only customer booking pages use this domain. Sign in to the owner dashboard through the main Kontracts address.</p></aside></div>`;}

async function brandingAction(name,node){if(BrandState.busy)throw new Error('The branding change is still saving.');const d=BrandState.data;if(name==='brand-tab'){if(S.dirty&&!confirm('Discard your unsaved changes?'))return;S.dirty=false;BrandState.tab=node.dataset.value;BrandState.data=await api('/branding');renderBrandingEditor();return;}if(name==='brand-publish'){await saveBrandDraft(false);setBrandBusy(true);try{const result=await api('/branding/publish',{method:'POST',body:{revision:BrandState.data.revision}});BrandState.data=result;await refreshMe();renderBrandingEditor();toast(result.message);}finally{setBrandBusy(false);}return;}if(name==='brand-full-preview'){await saveBrandDraft(false);go('/brand-preview');return;}if(name==='brand-email-preview'){const result=await api('/branding/email-preview');openModal('Published email preview',`<p class="muted small">From: ${e(result.from)}<br>Reply-to: ${e(result.reply_to)}<br>Uses published branding, not your unsaved draft. This preview sends no email.</p><iframe title="Branded email preview" class="brand-email-preview" sandbox srcdoc="${e(result.html)}"></iframe>`);return;}if(name==='brand-discard'){if(!confirm('Discard all unpublished branding changes and return to the live appearance?'))return;BrandState.data=await api('/branding/reset',{method:'POST',body:{revision:d.revision}});S.dirty=false;renderBrandingEditor();return;}if(name.startsWith('brand-remove-')){const b=collectBrandForm();await saveBrandDraft(false);BrandState.data=await api('/branding/assets/'+name.slice('brand-remove-'.length),{method:'DELETE',body:{revision:BrandState.data.revision}});renderBrandingEditor();return;}if(name==='brand-copy-link'){await copyText(d.booking_url);return;}if(name==='brand-copy-button'){await copyText(`<a href="${d.booking_url}" target="_blank" rel="noopener">Book a detail</a>`);return;}if(name==='brand-copy-dns'){await copyText('Type: TXT\nName: '+d.domain.txt_name+'\nValue: '+d.domain.txt_value);return;}if(name==='brand-domain-verify'){BrandState.data=await api('/branding/domain/verify',{method:'POST'});renderBrandingEditor();toast('Ownership verified. Hosting and HTTPS must still be activated by the operator.');return;}if(name==='brand-domain-remove'){if(!confirm('Disconnect this domain? Existing domain-specific links will stop opening. Your original booking link remains available.'))return;BrandState.data=await api('/branding/domain',{method:'DELETE'});await refreshMe();renderBrandingEditor();}}
async function optimizeBrandImage(file,kind){if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>20*1024*1024)throw new Error('Choose a still PNG, JPEG or WebP under 20 MB.');const src=URL.createObjectURL(file);try{const image=new Image();image.src=src;await image.decode();if(image.naturalWidth*image.naturalHeight>40_000_000)throw new Error('Choose an image under 40 megapixels.');const edge=kind==='logo'?640:1600,scale=Math.min(1,edge/Math.max(image.naturalWidth,image.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));const ctx=canvas.getContext('2d');if(kind==='cover'){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);}ctx.drawImage(image,0,0,canvas.width,canvas.height);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',.85));if(!blob)throw new Error('Your browser could not process this image.');return new File([blob],kind+'.webp',{type:blob.type});}finally{URL.revokeObjectURL(src);}}
document.addEventListener('input',event=>{const input=event.target,form=input.closest('[data-form="branding"]');if(form&&BrandState.data){const d={...BrandState.data.draft,...collectBrandForm()};const out=document.querySelector(`[data-color-output="${input.name}"]`);if(out)out.textContent=input.value.toUpperCase();const preview=document.querySelector('#brand-mini-preview');if(preview)preview.innerHTML=brandMiniPreview(d);const status=document.querySelector('#brand-save-status');if(status)status.textContent='Unsaved changes. Preview only until published.';}if(input.name==='slug'&&input.closest('[data-form="booking-slug"]')){clearTimeout(BrandState.slugTimer);const value=input.value;BrandState.slugTimer=setTimeout(async()=>{try{const result=await api('/booking-page/availability?slug='+encodeURIComponent(value));if(input.value!==value)return;const status=document.querySelector('#slug-availability');if(status)status.textContent=result.reason;}catch(_){}},350);}});
document.addEventListener('change',async event=>{const input=event.target,kind=input.dataset.brandUpload;if(!kind||!input.files?.length)return;if(BrandState.busy){toast('A branding operation is already running.',true);return;}const file=input.files[0];try{await saveBrandDraft(false);setBrandBusy(true);const optimized=await optimizeBrandImage(file,kind);const data=new FormData();data.append('revision',BrandState.data.revision);data.append('file',optimized);BrandState.data=await api('/branding/assets/'+kind,{method:'POST',body:data});renderBrandingEditor();toast((kind==='logo'?'Logo':'Cover')+' optimized to '+photoBytes(BrandState.data.upload.bytes)+'. Publish to make it public.');}catch(error){toast(error.message,true);}finally{setBrandBusy(false);input.value='';}});

/* Kontracts private car photos. Native capture, local compression, real API storage. */
'use strict';
const PhotoState = {pending: [], context: null, key: null, busy: false, uploadBusy: false,
  profile: 'compact', library: [], filter: 'all', search: '', usage: null, current: []};
const photoBytes = n => n < 1024 ? `${n} B` : n < 1024*1024 ? `${Math.round(n/1024)} KB` : `${(n/1024/1024).toFixed(1)} MB`;
const photoLabel = p => ({before:'Before',after:'After',condition:'Condition'})[p] || 'Photo';

function photoPicker(context, limit=3) {
  const quote = context === 'quote';
  const pending = quote ? (S.wizard?.photos || []) : PhotoState.pending;
  return `<div class="photo-picker" data-photo-draft="${context}">
    <div class="photo-picker-heading"><span class="photo-symbol">${icon('camera')}</span><div><strong>${quote ? 'Show us your car' : 'Add car photos'}</strong><p>Take a photo or choose from your gallery. We make the files smaller for you.</p></div></div>
    ${quote ? '' : `<div class="field photo-quality"><label for="photo-quality">Photo quality</label><select id="photo-quality" data-photo-quality ${pending.length?'disabled':''}><option value="compact" ${PhotoState.profile==='compact'?'selected':''}>Compact - smaller files, up to 1280 px</option><option value="detail" ${PhotoState.profile==='detail'?'selected':''}>More detail - up to 2048 px</option></select></div>`}
    <div class="photo-picker-buttons">
      <label class="btn primary" for="${context}-camera">${icon('camera')} Take photo</label>
      <input class="sr-only" id="${context}-camera" type="file" accept="image/*" capture="environment" data-photo-input="${context}" aria-label="Take a car photo">
      <label class="btn" for="${context}-gallery">${icon('image')} Choose photos</label>
      <input class="sr-only" id="${context}-gallery" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" multiple data-photo-input="${context}" aria-label="Choose car photos">
    </div>
    <p class="photo-footnote">Up to ${limit} at a time. GPS and other image metadata are removed on save. Camera availability depends on your browser.</p>
    <div id="${context}-photo-status" class="photo-status" role="status" aria-live="polite"></div>
    <div id="${context}-photo-pending" class="pending-photos">${pendingPhotoMarkup(pending,context)}</div>
  </div>`;
}

function pendingPhotoMarkup(items,context) {
  return items.map((p,i)=>`<div class="pending-photo"><img src="${e(p.src)}" alt="Selected vehicle photo ${i+1}"><div><strong>Photo ${i+1}</strong><span>${photoBytes(p.originalBytes)} ${icon('arrow')} ${photoBytes(p.file.size)}</span><small>${p.width} &times; ${p.height} px &middot; ready to save</small></div><button class="icon-btn" type="button" data-photo-remove="${i}" data-photo-context="${context}" aria-label="Remove selected photo ${i+1}">${icon('close')}</button></div>`).join('');
}

async function decodeBrowserImage(file) {
  if ('createImageBitmap' in window) {
    try { return await createImageBitmap(file, {imageOrientation:'from-image'}); } catch (_) {}
  }
  const url = URL.createObjectURL(file);
  try {
    return await new Promise((resolve,reject)=>{
      const image = new Image(); image.onload=()=>resolve(image); image.onerror=()=>reject(new Error('This browser could not open that image. Export HEIC/HEIF as JPEG, then try again.')); image.src=url;
    });
  } finally { URL.revokeObjectURL(url); }
}

async function compactPhoto(file, profile='compact') {
  if (file.size > 30*1024*1024) throw new Error('Choose a photo smaller than 30 MB.');
  if (!file.size) throw new Error('That file is empty. Choose a photo.');
  const source = await decodeBrowserImage(file);
  try {
    const width=source.naturalWidth||source.width, height=source.naturalHeight||source.height;
    if (width*height>50_000_000) throw new Error('This photo is larger than 50 megapixels. Resize it before adding it.');
    const edge = profile==='detail'?2048:1280, target=(profile==='detail'?350:150)*1024;
    const scale=Math.min(1,edge/Math.max(width,height));
    const canvas=document.createElement('canvas'); canvas.width=Math.max(1,Math.round(width*scale));canvas.height=Math.max(1,Math.round(height*scale));
    const ctx=canvas.getContext('2d',{alpha:false});
    if (!ctx) throw new Error('Photo conversion is not available in this browser. Try a recent browser.');
    ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(source,0,0,canvas.width,canvas.height);
    let blob;
    const encode=(quality,type='image/webp')=>new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('The browser could not compress this photo.')),type,quality));
    for(let pass=0;pass<4;pass++) {
      for(const quality of [.78,.68,.58]) {
        blob=await encode(quality);
        if(blob.type!=='image/webp') blob=await encode(quality,'image/jpeg');
        if(blob.size<=target) break;
      }
      if(blob.size<=target||Math.max(canvas.width,canvas.height)<=640) break;
      const copy=document.createElement('canvas');copy.width=canvas.width;copy.height=canvas.height;copy.getContext('2d').drawImage(canvas,0,0);
      const nextScale=Math.max(640,Math.round(Math.max(canvas.width,canvas.height)*.82))/Math.max(canvas.width,canvas.height);
      canvas.width=Math.max(1,Math.round(canvas.width*nextScale));canvas.height=Math.max(1,Math.round(canvas.height*nextScale));
      ctx.drawImage(copy,0,0,canvas.width,canvas.height); copy.width=copy.height=1;
    }
    if(!blob||blob.size>1024*1024) throw new Error('This photo could not be made small enough. Crop it and try again.');
    const extension=blob.type==='image/webp'?'webp':'jpg';
    const optimized=new File([blob],`vehicle-${crypto.randomUUID()}.${extension}`,{type:blob.type});
    return {file:optimized,src:URL.createObjectURL(blob),originalBytes:file.size,width:canvas.width,height:canvas.height};
  } finally { if(source.close)source.close(); }
}

function clearPhotoPending() {
  for(const p of PhotoState.pending)URL.revokeObjectURL(p.src);
  PhotoState.pending=[];PhotoState.key=null;
}

async function handlePhotoSelection(input) {
  const context=input.dataset.photoInput, files=[...input.files]; input.value='';
  if(!files.length)return;
  if(PhotoState.busy||PhotoState.uploadBusy){toast('Finish the current photo operation first.',true);return;}
  const items=context==='quote'?S.wizard.photos:PhotoState.pending;
  if(items.length+files.length>3){toast('Select up to three photos at a time. Save these before adding more.',true);return;}
  PhotoState.busy=true;
  const root=input.closest('.photo-picker'); root?.classList.add('processing');
  const status=document.getElementById(context+'-photo-status');
  const submitButton=context==='quote'?$('[data-form="wizard-details"] button[type="submit"]'):$('[data-action="photos-save"]');
  if(submitButton)submitButton.disabled=true;
  const errors=[];
  try {
    for(let i=0;i<files.length;i++) {
      if(status)status.textContent=`Making photo ${i+1} of ${files.length} smaller...`;
      try { items.push(await compactPhoto(files[i],context==='quote'?'compact':PhotoState.profile)); }
      catch(error){errors.push(error.message);}
    }
    if(context!=='quote')PhotoState.key=crypto.randomUUID();
    const pending=document.getElementById(context+'-photo-pending');
    if(pending)pending.innerHTML=pendingPhotoMarkup(items,context);
    if(status)status.textContent=items.length?`${items.length} photo${items.length===1?'':'s'} ready. ${photoBytes(items.reduce((n,p)=>n+p.file.size,0))} before the final server optimization.`:'No photos selected.';
    const quality=document.getElementById('photo-quality');if(quality)quality.disabled=items.length>0;
    if(errors.length)toast(errors[0],true);
  } finally {
    PhotoState.busy=false;root?.classList.remove('processing');
    if(submitButton)submitButton.disabled=context==='quote'?false:items.length===0;
  }
}

function photoCard(p, compact=false) {
  return `<article class="vehicle-photo-card ${compact?'compact':''}"><button type="button" class="photo-open" data-action="photo-view" data-id="${e(p.id)}" aria-label="Open ${e(photoLabel(p.category))} photo${p.customer_name?' for '+e(p.customer_name):''}"><img loading="lazy" decoding="async" src="${e(p.thumbnail_url)}" alt="${e(p.caption||photoLabel(p.category)+' vehicle photo')}"><span class="photo-category ${e(p.category)}">${photoLabel(p.category)}</span></button><div class="photo-card-info"><strong>${e(p.customer_name||p.caption||photoLabel(p.category)+' photo')}</strong><small>${e(p.vehicle_notes||p.caption||'Private job record')}</small><div><span>${photoBytes(p.size_bytes)}</span><span>${p.uploaded_by==='customer'?'Customer upload':'Owner upload'}</span></div></div></article>`;
}

async function photosPage() {
  const data=await api('/media');PhotoState.library=data.photos;PhotoState.usage=data.storage;
  return renderPhotoLibrary();
}
function renderPhotoLibrary() {
  const usage=PhotoState.usage||{count:0,used_bytes:0,limit_bytes:1};
  const matches=PhotoState.library.filter(p=>(PhotoState.filter==='all'||p.category===PhotoState.filter)&&`${p.customer_name} ${p.vehicle_notes} ${p.caption}`.toLowerCase().includes(PhotoState.search.toLowerCase()));
  const percent=Math.min(100,100*usage.used_bytes/usage.limit_bytes);
  return `${heading('Every car. Every detail.','Private before, after and condition photos, attached to the right job.',`<div class="row wrap"><a class="btn" href="/api/export/photos.zip">${icon('download')} Export photos</a>${btn(icon('camera')+' Add car photos','photos-choose-job','primary')}</div>`)}
  <div class="photo-overview"><div><span class="eyebrow">Job photo library</span><h2>${usage.count} <span>photos saved</span></h2><p>Small files. A clear record of your work.</p></div><div class="photo-storage"><div><strong>Photo storage</strong><span>${photoBytes(usage.used_bytes)} / ${photoBytes(usage.limit_bytes)}</span></div><progress max="100" value="${percent}" aria-label="Photo storage used"></progress><small>Includes job photos, quote photos and thumbnails. Limits are workspace-wide.</small></div></div>
  <div class="photo-library-toolbar"><div class="segmented" aria-label="Filter photos">${['all','before','after','condition'].map(category=>`<button data-action="photos-filter" data-value="${category}" class="${PhotoState.filter===category?'active':''}" aria-pressed="${PhotoState.filter===category}">${category==='all'?'All photos':photoLabel(category)}</button>`).join('')}</div><input type="search" class="photo-search" placeholder="Search customer, car or caption" aria-label="Search car photos" data-photo-search value="${e(PhotoState.search)}"></div>
  <div class="vehicle-photo-grid">${matches.length?matches.map(p=>photoCard(p)).join(''):`<div class="card photo-empty">${empty(PhotoState.library.length?'No matching photos':'Your work deserves a clear record',PhotoState.library.length?'Try a different search or filter.':'Choose a booking, then take the first before photo. It will appear here, safely linked to that customer.','camera',btn(icon('plus')+' Add the first photo','photos-choose-job','primary'))}</div>`}</div>
  <p class="photo-library-note">Only your workspace can view this library. Compression is lossy; keep original evidence separately when documenting damage. The newest 500 job photos are shown.</p>`;
}

async function choosePhotoJob() {
  if(PhotoState.uploadBusy)throw new Error('Wait until the photo save finishes.');
  const rows=(await api('/bookings')).bookings;S.bookings=rows;
  openModal('Choose a job',`<p class="muted small mb16">Photos stay with their booking and customer record.</p><input type="search" id="photo-job-search" placeholder="Search customer or vehicle" aria-label="Search jobs for photos"><div id="photo-job-options" class="photo-job-options">${photoJobOptions(rows)}</div>`);
}
function photoJobOptions(rows) {
  return rows.length?rows.slice().sort((a,b)=>b.start_ts-a.start_ts).slice(0,80).map(b=>`<button class="photo-job-option" data-action="photos-open" data-id="${e(b.id)}"><span class="avatar">${e(b.customer_name[0])}</span><span class="grow"><strong>${e(b.customer_name)}</strong><small>${e(b.vehicle_notes||b.snapshot.vehicle)} &middot; ${dateLabel(b.start_ts,{month:'short',day:'numeric'})}</small></span>${icon('arrow')}</button>`).join(''):empty('No jobs yet','Create a booking first, then attach photos to it.','calendar',nav('Add a booking','/app/new-booking','btn primary'));
}

async function openJobPhotos(id, keepDraft=false) {
  if(PhotoState.uploadBusy)throw new Error('Wait until the photo save finishes.');
  if(!keepDraft&&PhotoState.pending.length&&!confirm('Discard the photos that have not been saved?'))return;
  if(!keepDraft)clearPhotoPending();
  PhotoState.context={type:'owner',id};
  const data=await api('/bookings/'+id+'/photos');PhotoState.current=data.photos;
  openModal('Car photos',`<div class="job-photo-title"><div><h3>${e(data.customer_name)}</h3><p>${e(data.vehicle_notes||'Vehicle record')}</p></div><span class="pill">${data.photos.length} / ${data.photo_limit} photos</span></div><div class="photo-upload-fields"><div class="field"><label for="photo-category">Photo label</label><select id="photo-category"><option value="before">Before</option><option value="after">After</option><option value="condition">Condition / existing damage</option></select></div>${field('Optional caption','photo_caption','','text','maxlength="240" placeholder="e.g. Driver-side seat before cleaning"')}</div>${photoPicker('job')}<div class="photo-save-row"><span>Saved photos are private to your business.</span>${btn(icon('upload')+' Save photos','photos-save','primary',PhotoState.pending.length?'':'disabled')}</div><hr><div class="row between mb16"><h3>Job gallery</h3><span class="muted small">Before &middot; After &middot; Condition</span></div><div class="job-photo-grid">${data.photos.length?data.photos.map(p=>photoCard(p,true)).join(''):empty('No photos on this job yet','A quick before photo is a good place to start.','camera')}</div><p class="photo-footnote mt16">Images are optimized, not preserved originals. Keep originals separately for insurance, disputes or fine-damage evidence.</p>`);
}

async function customerPhotoPanel(raw) {
  const data=await api('/public/manage/'+raw+'/photos');
  PhotoState.customerPhotos=data.photos;
  const target=document.getElementById('customer-photos');if(!target)return;
  target.innerHTML=`<div class="row between"><h3>Your car photos</h3><span class="pill">${data.photos.length} / ${data.photo_limit}</span></div><p class="muted small mt8">Help the detailer prepare. Show areas that need attention. Only photos you submitted appear here; the business's own job notes stay private.</p><div class="job-photo-grid mt16">${data.photos.map(p=>photoCard(p,true)).join('')}</div>${data.can_upload?btn(icon('camera')+' Add condition photos','photos-customer-open','mt16','data-token="'+e(raw)+'"'):'<p class="muted small mt16">New photos can be added to confirmed bookings.</p>'}`;
}
async function openCustomerPhotos(raw) {
  if(PhotoState.uploadBusy)throw new Error('Wait until the photo save finishes.');
  if(PhotoState.pending.length&&!confirm('Discard the photos that have not been saved?'))return;
  clearPhotoPending();PhotoState.context={type:'customer',token:raw};
  openModal('Show us your car',`<p class="muted small mb16">Add condition photos for your confirmed appointment. Your detailer can see them; they are not public.</p>${field('Optional note','photo_caption','','text','maxlength="240" placeholder="e.g. Pet hair on the rear seats"')}${photoPicker('job')}<div class="photo-save-row"><span>Up to six photos per booking.</span>${btn(icon('upload')+' Save photos','photos-save','primary','disabled')}</div>`);
}
async function saveJobPhotos() {
  if(PhotoState.busy||PhotoState.uploadBusy)throw new Error('Finish the current photo operation first.');
  if(!PhotoState.pending.length)throw new Error('Take a photo or choose one from your gallery.');
  const context=PhotoState.context,body=new FormData();
  body.append('category',context.type==='customer'?'condition':$('#photo-category').value);
  body.append('caption',$('[name="photo_caption"]')?.value||'');body.append('profile',PhotoState.profile);
  body.append('upload_key',PhotoState.key||crypto.randomUUID());
  body.append('original_sizes',JSON.stringify(PhotoState.pending.map(p=>p.originalBytes)));
  for(const photo of PhotoState.pending)body.append('files',photo.file);
  PhotoState.uploadBusy=true;
  const status=$('#job-photo-status');if(status)status.textContent='Saving privately. Keep this page open...';
  try {
    const path=context.type==='customer'?'/public/manage/'+context.token+'/photos':'/bookings/'+context.id+'/photos';
    const result=await api(path,{method:'POST',body});clearPhotoPending();toast(result.message);
    PhotoState.uploadBusy=false;
    if(context.type==='customer'){closeModal();await customerPhotoPanel(context.token);}
    else {await openJobPhotos(context.id,true);if(window.__previewURL.pathname==='/app/photos')$('#main').innerHTML=await photosPage();}
  } catch(error) {
    if(status)status.textContent='Not confirmed saved. Your selected photos are still here. Retry to avoid duplicates.';
    throw error;
  } finally {PhotoState.uploadBusy=false;}
}

function findPhoto(id) {
  if(window.__previewURL.pathname.startsWith('/manage/'))return PhotoState.customerPhotos?.find(p=>p.id===id);
  return PhotoState.current.find(p=>p.id===id)||PhotoState.library.find(p=>p.id===id)||PhotoState.customerPhotos?.find(p=>p.id===id);
}
function viewPhoto(id) {
  if(PhotoState.pending.length)throw new Error('Save or remove your selected photos before opening another photo.');
  const p=findPhoto(id);if(!p)throw new Error('Refresh this gallery before opening the photo.');
  PhotoState.viewing=p;
  const customer=p.customer_view||p.url.includes('/public/manage/');
  openModal(photoLabel(p.category)+' photo',`<img class="photo-lightbox" src="${e(p.url)}" alt="${e(p.caption||photoLabel(p.category)+' vehicle photo')}"><div class="photo-detail-meta"><span>${p.width} &times; ${p.height} px</span><span>${photoBytes(p.size_bytes)} with thumbnail</span><span>${e(p.profile)} quality</span></div>${customer?`<p>${e(p.caption)}</p>`:`<form data-form="photo-edit" data-id="${e(p.id)}"><div class="form-grid"><div class="field"><label for="edit-photo-category">Label</label><select id="edit-photo-category" name="category">${['before','after','condition'].map(x=>`<option value="${x}" ${x===p.category?'selected':''}>${photoLabel(x)}</option>`).join('')}</select></div>${field('Caption','caption',p.caption,'text','maxlength="240"')}</div><div class="form-footer"><button class="btn" type="submit">Save details</button></div></form>`}<div class="modal-actions"><a class="btn" download="car-${e(p.category)}.webp" href="${e(p.url)}">${icon('download')} Download</a>${customer?'':btn('Delete photo','photo-delete','danger','data-id="'+e(p.id)+'"')}${customer?'':btn('Back to job','photos-open','','data-id="'+e(p.booking_id)+'"')}</div>`);
}
async function deleteJobPhoto(id) {
  if(!confirm('Delete this photo from active storage? Existing backups follow their retention schedule.'))return;
  const p=findPhoto(id);const result=await api('/job-photos/'+id,{method:'DELETE'});toast(result.message);
  if(window.__previewURL.pathname==='/app/photos')$('#main').innerHTML=await photosPage();
  await openJobPhotos(p.booking_id);
}
async function editJobPhoto(form) {
  const fd=new FormData(form),p=PhotoState.viewing;
  await api('/job-photos/'+form.dataset.id,{method:'PATCH',body:{category:fd.get('category'),caption:fd.get('caption')}});
  toast('Photo details saved.');if(window.__previewURL.pathname==='/app/photos')$('#main').innerHTML=await photosPage();
  await openJobPhotos(p.booking_id);
}

// Native file-picker change events keep mobile capture in a direct user gesture.
document.addEventListener('change',event=>{
  if(event.target.dataset.photoInput)handlePhotoSelection(event.target).catch(err=>toast(err.message,true));
  if(event.target.hasAttribute('data-photo-quality'))PhotoState.profile=event.target.value;
});
document.addEventListener('click',event=>{
  const remove=event.target.closest('[data-photo-remove]');if(!remove)return;
  event.preventDefault();if(PhotoState.busy||PhotoState.uploadBusy)return;
  const context=remove.dataset.photoContext,items=context==='quote'?S.wizard.photos:PhotoState.pending;

ned PDF':'Open and save PDF'}</a>`}${i.status==='signed'&&i.payment_method==='square'&&i.balance&&!i.payment_review?btn('Pay balance with Square','invoice-pay','',`data-token="${e(raw)}"`):''}</div></section>${i.status!=='signed'?`<section class="card card-pad mt24"><h2>Sign after reviewing the PDF</h2><p class="muted small mt16">First open and save the PDF above. Then request a code at the original customer email on this invoice. The detailer cannot change that email at signing.</p>${btn('Email my signing code','invoice-code','mt16',`data-token="${e(raw)}"`)}<form data-form="invoice-sign" class="mt24">${field('Your full name as your electronic signature','signer_name','','text','required minlength="2" maxlength="80" autocomplete="name"')}${field('Six-digit email code','code','','text','required pattern="[0-9]{6}" maxlength="6" inputmode="numeric" autocomplete="one-time-code"')}<label class="check-row"><input type="checkbox" name="consent" required><span>${e(i.consent_text)}</span></label><button type="submit" class="btn primary wide mt24">Sign and save invoice</button></form></section>`:`<div class="notice mt24">The signed PDF is retained. Save a copy for your records. Later payments do not change the original signed document.</div>`}<p class="muted small mt24">Need a paper copy, a correction or help? Email <a href="mailto:${e(i.correspondence_email)}">${e(i.correspondence_email)}</a> with ${e(i.number)}. Keep this private link safe. Electronic signatures here are not identity certification or certificate-based PDF signatures.</p></main>${minimalFooter()}</div>`;}
async function workflowAction(name,node){const id=node.dataset.id,raw=node.dataset.token;if(name==='approve-job'){if(!confirm('Approve this job and email the customer? Square deposit links are sent only after approval.'))return true;const result=await api('/bookings/'+id+'/approve',{method:'POST'});closeModal();toast(result.message||'Job approved. Customer update queued.');await renderPage();return true;}if(name==='finish-invoice'){const b=S.bookings.find(x=>x.id===id);openModal('Finish & sign the invoice',`<p>Review this job before signing. The customer will receive a PDF and a separate email verification code. The job stays awaiting signature until the customer signs.</p><form data-form="finish-invoice" data-id="${e(id)}" class="mt24">${field('Your full name as your electronic signature','signer_name',S.me.user.name,'text','required minlength="2" maxlength="80"')}<label class="check-row"><input type="checkbox" name="consent" required><span>I certify that the listed service was performed and I intend my typed name to electronically sign this invoice. Payment is recorded separately.</span></label>${b.payment_method==='in_person'?'<label class="check-row mt16"><input type="checkbox" name="received_in_person"><span>I have actually received the full in-person payment. Leave unchecked when money is still due.</span></label>':''}<button type="submit" class="btn primary wide mt24">Sign invoice &amp; send to customer</button></form>`);return true;}if(name==='invoice-resend'){toast((await api('/invoices/'+id+'/send-link',{method:'POST'})).message);return true;}if(name==='invoice-cash'){if(confirm('Confirm that you have actually received the full remaining payment in person?')){toast((await api('/invoices/'+id+'/received-in-person',{method:'POST',body:{confirmation:'PAYMENT RECEIVED'}})).message);await renderPage();}return true;}if(name==='invoice-code'){toast((await api('/public/invoices/'+encodeURIComponent(raw)+'/code',{method:'POST'})).message);return true;}if(name==='in async function workflowSubmit(form){const fd=new FormData(form);switch(form.dataset.form){case'payment-preference':{const settings=structuredClone(S.me.shop.settings);settings.payment_method=fd.get('payment_method');await persistSettings(settings);toast('Payment preference saved for new requests.');await renderPage();return true;}case'finish-invoice':{await api('/bookings/'+form.dataset.id+'/complete',{method:'POST',body:{signer_name:fd.get('signer_name'),consent:fd.has('consent'),received_in_person:fd.has('received_in_person')}});closeModal();toast('Detailer-signed invoice saved. Customer signature requested.');go('/app/invoices');return true;}case'invoice-sign':{const i=S.invoice;toast((await api('/public/invoices/'+encodeURIComponent(i.token)+'/sign',{method:'POST',body:{signer_name:fd.get('signer_name'),code:fd.get('code'),consent:fd.has('consent'),document_hash:i.document_hash}})).message);await publicInvoice(i.token);return true;}}return false;}

function addDays(date,n){const d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function localTimestamp(date,time,zone){const desired=Date.parse(date+'T'+time+':00Z');let guess=desired;for(let i=0;i<3;i++){const p=new Intl.DateTimeFormat('en-GB',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date(guess));const get=k=>p.find(x=>x.type===k).value;const actual=Date.parse(`${get('year')}-${get('month')}-${get('day')}T${get('hour')}:${get('minute')}:${get('second')}Z`);guess+=desired-actual;}return Math.floor(guess/1000);}
function statusBadge(status){const labels={pending_approval:'Awaiting approval',awaiting_signature:'Awaiting signature',signed:'Signed & saved',trial:'Free trial',active:'Active',trialing:'Trial',held:'Awaiting deposit',confirmed:'Confirmed',completed:'Completed',cancelled:'Cancelled',expired:'Expired',payment_review:'Payment review',no_show:'No-show',new:'Needs a quote',offered:'Quote sent',reserved:'Reserved',declined:'Declined',paid:'Paid',unpaid:'Not collected',pending:'Pending',refunded:'Refunded',refund_pending:'Refund pending',refund_failed:'Refund failed',partially_refunded:'Partly refunded'};const cls=['signed','active','confirmed','completed','paid','offered'].includes(status)?'green':['pending_approval','awaiting_signature','held','new','payment_review','refund_pending','pending'].includes(status)?'amber':['refund_failed','no_show'].includes(status)?'red':'';return `<span class="pill ${cls}"><span class="dot"></span>${e(labels[status]||status)}</span>`;}
async function api(path,{method='GET',body,headers={}}={}){const h={'X-Requested-With':'Kontracts',...headers};if(S.me?.csrf)h['X-CSRF-Token']=S.me.csrf;if(body!==undefined&&!(body instanceof FormData)){h['Content-Type']='application/json';body=JSON.stringify(body);}const r=await fetch('/api'+path,{method,body,headers:h,credentials:'same-origin',cache:'no-store'});let data;try{data=await r.json();}catch{throw new Error('The server returned an unexpected response. Please try again.');}if(!r.ok){let detail=data.detail||'Something went wrong.';if(Array.isArray(detail))detail=detail.map(d=>`${d.loc?.slice(1).join(' ')||'Field'}: ${d.msg}`).join('; ');const error=new Error(String(detail));error.status=r.status;throw error;}return data;}
let toastTimer;
function toast(message,error=false){clearTimeout(toastTimer);$('#toast-region').innerHTML=`<div class="toast ${error?'error':''}" role="status">${e(message)}</div>`;toastTimer=setTimeout(()=>$('#toast-region').innerHTML='',6500);}
function formError(form,message){let box=$('.form-error',form);if(!box){box=document.createElement('div');box.className='form-error notice error mt16';box.setAttribute('role','alert');form.prepend(box);}box.textContent=message;box.scrollIntoView({block:'nearest',behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}

async function render(){const route=++S.route;const app=$('#app');try{if(!S.config)S.config=await api('/config');const path=window.__previewURL.pathname;if(path==='/how-payments-work'){resetBrandDocument();app.innerHTML=paymentsExplainer();return;}if(path.startsWith('/invoice/')){await publicInvoice(path.split('/')[2]);return;}if(!path.startsWith('/book/')&&!path.startsWith('/quote/')&&!path.startsWith('/manage/')&&path!=='/brand-preview'&&!S.config.tenant_slug)resetBrandDocument();if(path==='/brand-preview'){try{S.me=await api('/auth/me');}catch(err){if(err.status===401){go('/login',true);return;}throw err;}await initWizard(S.me.shop.slug,false,true);return;}if(path.startsWith('/app')){try{S.me=await api('/auth/me');}catch(err){if(err.status===401){go('/login',true);return;}throw err;}if(route!==S.route)return;renderShell(path);await renderPage(path);return;}if(path==='/'){if(S.config.tenant_slug){await initWizard(S.config.tenant_slug);return;}app.innerHTML=landing();return;}if(['/login','/register','/forgot-password','/reset-password','/verify-email'].includes(path)){app.innerHTML=authPage(path);return;}if(['/terms','/privacy'].includes(path)){app.innerHTML=legalPage(path);return;}if(path==='/google/complete'){app.innerHTML=await googleCompletePage();return;}if(path==='/checkout'){app.innerHTML=`<main id="main" class="booking-manage">${brand()}<div class="card card-pad mt32"><h1>Activate Kontracts</h1><p class="muted mt16">Your subscription checkout is opening securely with Paddle.</p><div id="checkout-status" class="mt24"></div></div></main>`;await openPaddle();return;}if(path.startsWith('/book/')){await initWizard(decodeURIComponent(path.split('/')[2]));return;}if(path.startsWith('/quote/')){await initQuoteWizard(path.split('/')[2]);return;}if(path.startsWith('/manage/')){await renderManage(path.split('/')[2]);return;}if(path.startsWith('/demo-checkout/')){await renderDemoCheckout(path.split('/')[2]);return;}app.innerHTML=`<main id="main" class="error-box card">${empty('Page not found','The link may have changed.','help',nav('Back to home','/','btn primary'))}</main>`;}catch(err){app.innerHTML=`<main id="main" class="error-box card">${empty('We could not open this page',err.message,'help',btn('Try again','reload','primary'))}</main>`;}}
function renderShell(path){const page=path.split('/')[2]||'overview';const shop=S.me.shop;const days=Math.max(0,Math.ceil((shop.trial_end-Date.now()/1000)/86400));const menu=[['overview','Overview','grid'],['bookings','Bookings','calendar'],['quotes','Quote requests','chat'],['photos','Car photos','camera'],['customers','Customers','people'],['services','Services & prices','dollar'],['invoices','Invoices','file']];const bottom=[['setup','Getting started','check'],['branding','Brand & booking page','spark'],['settings','Settings','settings'],['billing','Subscription','card'],['help','Help & activity','help']];const item=([key,label,ic])=>`<a class="nav-item ${page===key?'active':''}" href="/app/${key==='overview'?'':key}" data-nav ${page===key?'aria-current="page"':''}>${icon(ic)}${label}</a>`;$('#app').innerHTML=`<div class="shell"><button class="mobile-backdrop" data-action="menu" aria-label="Close navigation"></button><aside class="sidebar">${brand()}<div class="workspace row"><span class="avatar">${e(shop.name.slice(0,1))}</span><div class="grow"><div class="name">${e(shop.name)}</div><small>Solo workspace</small></div>${icon('down')}</div><div class="nav-caption">Workspace</div><nav aria-label="Main navigation">${menu.map(item).join('')}<div class="nav-caption">Manage</div>${bottom.map(item).join('')}</nav><div class="sidebar-bottom">${shop.billing_status==='trial'?`<div class="trial-note"><strong>${shop.demo?'Your next chapter starts here':days+' days left in your trial'}</strong><p>${shop.demo?'Explore every corner. No real payments.':'One booking page. A calmer business.'}</p>${nav(shop.demo?'Create a workspace':'View subscription',shop.demo?'/register':'/app/billing','btn small wide')}</div>`:''}<div class="account row"><span class="avatar">${e(S.me.user.name.split(' ').map(x=>x[0]).slice(0,2).join(''))}</span><div class="grow"><strong class="small">${e(S.me.user.name)}</strong><div class="muted" style="font-size:10px">Business owner</div></div><button class ton></form><div class="auth-bottom">Already have an account? ${nav('Log in','/login','')}</div>`;else if(path==='/forgot-password')content=`<h1>Let's get you back in.</h1><p>Enter your email and we'll send a password-reset link.</p><form data-form="forgot">${field('Email address','email','','email','required autocomplete="email"')}<button class="btn primary wide" type="submit">Send reset link ${icon('arrow')}</button></form><div class="auth-bottom">${nav('Back to log in','/login','')}</div>`;else if(path==='/reset-password')content=`<h1>A fresh start.</h1><p>Choose a new password with at least 12 characters.</p><form data-form="reset">${field('New password','password','','password','required minlength="12" maxlength="128" autocomplete="new-password"')}<button class="btn primary wide" type="submit">Update password</button></form>`;else content=`<h1>One last check.</h1><p>Confirm your email to publish your business's booking page.</p>${btn('Verify my email '+icon('check'),'verify-email','primary wide')}<div class="auth-bottom">${nav('Back to your workspace','/app','')}</div>`;return `<div class="auth-page"><aside class="auth-brand-panel">${brand()}<div><span class="eyebrow">Detailing, without the detours</span><h1 class="mt24">A clearer schedule.<br>A little peace of mind.</h1><p>A simple home for your bookings, quotes and customers. Built around the way you work.</p></div><small>One operator. One calendar. Your business.</small></aside><main id="main" class="auth-content"><div class="auth-form"><div class="auth-logo-mobile">${brand()}</div>${content}</div></main></div>`;}

async function dashboardPage(){const d=await api('/dashboard');S.bookings=d.bookings;const shop=S.me.shop;const completed=[['Verify email',S.me.user.verified],['Review your business settings',shop.settings.policy_reviewed],['Choose how you collect payment',shop.settings.payment_method==='in_person'||shop.square_connected||shop.demo],['Publish your booking page',shop.published]];return `${heading('A clearer day ahead.',`Here's what's happening at ${shop.name}.`,nav(icon('plus')+' New booking','/app/new-booking','btn primary'))}${!S.me.user.verified?`<div class="notice amber row wrap"><span>Verify your email before publishing your booking page.</span><span class="spacer"></span>${btn('Resend email','resend-verification','small')}</div>`:''}${d.stats.pending_approvals?`<div class="notice amber mt16">${d.stats.pending_approvals} booking request(s) await your approval. ${nav('Review requests','/app/bookings','link-button')}</div>`:''}${d.stats.payment_reviews?`<div class="notice amber mt16">${d.stats.payment_reviews} payment needs review. No appointment was automatically confirmed. ${nav('Open bookings','/app/bookings','link-button')}</div>`:''}${d.stats.email_failures?`<div class="notice error mt16">Some emails exhausted their retries. ${nav('Check delivery activity','/app/help','link-button')}</div>`:''}<div class="stats">${stat('Scheduled value',money(d.stats.scheduled_value),'Confirmed + completed this month','dollar')}${stat('Deposits received',money(d.stats.deposits_received),'Net deposits on this month’s jobs','card')}${stat('Upcoming bookings',d.stats.upcoming,'Confirmed appointments ahead','calendar')}${stat('Quote requests',d.stats.quote_requests,'Waiting for your review','chat')}</div><div class="dashboard-grid"><section class="card"><div class="card-head"><div class="row"><h2>On the calendar</h2><span class="inline-count">${d.bookings.length}</span></div>${nav('View all '+icon('arrow'),'/app/bookings','link-button')}</div>${bookingTable(d.bookings.slice(0,6), t','primary small')}</div>${!shop.square_configured&&!shop.demo?'<div class="notice amber mt16">The platform operator must configure Square credentials and the webhook endpoint before this connection can be activated.</div>':''}<form data-form="settings-payments" data-dirty><div class="form-grid mt24">${field('Deposit percentage','deposit_percent',s.deposit_percent,'number','required min="0" max="100"')}${field('Service tax rate (%)','tax_rate',(s.tax_basis_points/100).toFixed(2),'number','required min="0" max="20" step="0.01"')}</div><p class="muted small mt16">A 0% deposit confirms bookings without collecting payment. Tax is a business-configured rate, not an automatic US tax determination. Confirm applicability with your adviser.</p><div class="form-footer"><button class="btn primary" type="submit">Save payment rules ${icon('check')}</button></div></form>${shop.square_connected?`<hr>${btn('Disconnect Square','square-disconnect','danger small')}<p class="muted small mt8">Your page is unpublished when disconnected. Unresolved deposits must be handled first.</p>`:''}`;if(tab==='policy')content=`<h2>Set expectations, clearly.</h2><p class="muted small mt8 mb16">Customers accept your policy before booking. Review the sample text for your business.</p><form data-form="settings-policy" data-dirty>${field('Self-service changes close before a job (hours)','cancellation_hours',s.cancellation_hours,'number','required min="0" max="168"')}<div class="field mt16"><label for="policy">Cancellation & rescheduling policy</label><textarea id="policy" name="cancellation_policy" required minlength="20" maxlength="2000" style="min-height:170px">${e(s.cancellation_policy)}</textarea></div><label class="check-row mt24"><input type="checkbox" name="policy_reviewed" ${s.policy_reviewed?'checked':''}><span>I have checked my service prices, ZIP codes, tax rate, availability and cancellation policy for this business. I understand refunds are separate from cancellations.</span></label><div class="form-footer"><button class="btn primary" type="submit">Save policy ${icon('check')}</button></div></form><hr><div class="row between wrap"><div><h3>Your booking page</h3><p class="muted small mt8">${shop.published?'Live and accepting bookings.':'Not visible to customers until you publish.'}</p></div>${btn(shop.published?'Unpublish page':'Publish booking page','publish',shop.published?'':'primary',`data-value="${!shop.published}"`)}</div>`;if(tab==='account')content=`<h2>Your account & data.</h2><p class="muted small mt8 mb16">${e(S.me.user.email)}</p><form data-form="change-password">${field('Current password','current_password','','password','required autocomplete="current-password"')}${field('New password','password','','password','required minlength="12" maxlength="128" autocomplete="new-password"')}<div class="form-footer"><button class="btn primary" type="submit">Change password</button></div></form><hr><h3>Take your data with you</h3><p class="muted small mt8">Exports include your business records, without passwords or payment-provider credentials.</p><div class="row wrap mt16"><a class="btn" href="/api/export/bookings.csv">${icon('download')} Bookings CSV</a><a class="btn" href="/api/export/account.json">${icon('download')} Account JSON</a></div><hr><h3>Delete your account</h3><p class="muted small mt8">Resolve upcoming jobs and pending payments, and cancel any active subscription first. Deletion cannot be undone.</p>${btn('Delete account','delete-account-open','danger small mt16')}`;return `${heading('A setup that feels like you.','A few good defaults. Full control where it matters.')}<div class="settings-layout"><nav class="settings-nav" aria-label="Settings sections">${[['business','Business profile'],['schedule','Availability'],['payments','Payments'],['policy','Policy & publishing'],['account','Account & data']].map(([key,label])=>`<button class="${tab===key?'active':''}" data-action="settings-tab" data-value="${key}">${label}</button>`).join('')}</ function helpPage(data){return `${heading('A little help, right here.','Answers, delivery status and your latest account activity.')}<div class="card card-pad"><h2>Questions? Start here.</h2><div class="faq"><details><summary>Why isn't my booking page live?</summary><p>Verify your email, review your policy and business settings, connect Square or intentionally set deposits to zero, then publish under Settings → Policy & publishing. Your trial or subscription must be active.</p></details><details><summary>Does cancelling a booking return the deposit?</summary><p>No. Cancelling releases the appointment. Refunds are a separate, explicit action under Booking details. Review your policy and customer agreement before refunding.</p></details><details><summary>What does “Payment review” mean?</summary><p>A payment was verified after its reservation was unavailable. No appointment was automatically confirmed. Contact the customer and either choose an available time or refund the deposit.</p></details><details><summary>How are other calendars handled?</summary><p>This release uses the Kontracts calendar as its scheduling record. Add phone bookings and block other commitments here. External calendar sync, multiple operators and route optimization are not included.</p></details><details><summary>Why haven't emails arrived locally?</summary><p>In development without SMTP, messages are saved as .eml files in data/mail instead of being sent. Production requires configured SMTP. The queue below shows messages waiting or retrying.</p></details></div><p class="muted small mt24">Support: <a class="link-button" href="mailto:${e(S.config.support_email)}">${e(S.config.support_email)}</a></p></div><div class="card mt24"><div class="card-head"><h2>Email delivery queue</h2>${btn(icon('refresh')+' Retry failed messages','retry-emails','small')}</div>${data.email_queue.length?`<div class="table-scroll"><table><thead><tr><th>Subject</th><th>Attempts</th><th>Last issue</th></tr></thead><tbody>${data.email_queue.map(m=>`<tr><td>${e(m.subject)}</td><td>${m.attempts} / 8</td><td>${e(m.last_error||'Queued')}</td></tr>`).join('')}</tbody></table></div>`:empty('All caught up','No messages are currently waiting in your delivery queue.','mail')}</div><div class="card mt24"><div class="card-head"><h2>Recent activity</h2></div>${data.activity.length?`<div class="table-scroll"><table><thead><tr><th>Action</th><th>When</th></tr></thead><tbody>${data.activity.map(a=>`<tr><td>${e(a.action.replaceAll('.',' · ').replaceAll('_',' '))}</td><td>${dateLabel(a.created_at,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</td></tr>`).join('')}</tbody></table></div>`:empty('A clean slate','Important booking and account changes appear here.','file')}</div>`;}
function legalPage(path){const privacy=path==='/privacy';const reviewed=privacy?S.config.privacy_text:S.config.terms_text;if(reviewed)return `<div class="marketing"><nav class="site-nav">${brand()}${nav('Back to home','/','btn small')}</nav><main id="main" class="legal"><h1>${privacy?'Privacy policy':'Terms of service'}</h1><div class="policy-text">${e(reviewed)}</div></main></div>`;return `<div class="marketing"><nav class="site-nav">${brand()}${nav('Back to home','/','btn small')}</nav><main id="main" class="legal"><h1>${privacy?'Privacy policy':'Terms of service'}</h1>${!S.config.legal_name?'<div class="notice amber">Pre-launch document. The operator must add its legal identity and review these terms before production use.</div>':''}<p>Service operator: ${e(S.config.legal_name||'Operator details pending')}. ${e(S.config.legal_address||'')} Contact: ${e(S.config.support_email)}.</p>${privacy?`<h2>What the service processes</h2><p>Kontracts stores business-account details, authentication records, service settings, booking information, customer contact details, optional vehicle photographs, quote requests and operational logs. Do not upload payment-card information or unrelated sensitive documents.</p><h2>Why information is used</h2><p>Information is used to operate accounts, calculate quotes, schedule work, communicate service updates, reconcile payments, provide support and protect the service. This application does not include advertising trackers or sell personal data.</p><h2>Payments and service providers</h2><p>Square handles detailing deposits on the business's own seller account. Paddle handles the software subscription. Card details are entered on provider-hosted checkouts and are not stored by Kontracts. Hosting, email and payment providers process information needed for their services.</p><h2>Business and customer responsibilities</h2><p>The detailing business determines why it collects customer information and is responsible for its customer notices and lawful use. The platform processes booking information to deliver the software. Contact the detailing business about service bookings and the platform operator about software-account data.</p><h2>Access, deletion and retention</h2><p>Business owners can export account and booking records. Account deletion removes active application records after outstanding operational obligations are resolved. Independent payment-provider records may remain under their own retention requirements. The operator must publish its actual backup retention period and data-processing terms before launch. Customer requests can be made through the business or the operator's contact address.</p><h2>Security and international processing</h2><p>The service uses encrypted connections when deployed over HTTPS, server-side access controls, password hashing and encrypted payment connection credentials. No service can promise absolute security. The platform is intended to be operated from India for US businesses; hosting and vendors may process information in other locations identified by the operator.</p><h2>Essential cookies</h2><p>An essential, HTTP-only session cookie keeps business owners signed in. The production app does not store passwords or payment-provider secrets in browser storage.</p>`:`<h2>The software</h2><p>Kontracts is software for a single-operator detailing business to present services, accept booking requests, schedule work and manage deposits. It is not the provider of detailing services and does not guarantee customer acquisition, income, uninterrupted availability or a particular commercial result.</p><h2>Your business</h2><p>You are responsible for accurate prices, service-area settings, tax treatment, availability, cancellation terms, customer communications, fulfilment, and compliance applicable to your detailing operation. Keep off-platform commitments recorded in the calendar.</p><h2>Subscriptions</h2><p>The current monthly plans are Starter USD 49, Pro USD 69 and Business USD 99, plus applicable taxes. A 14-day internal trial requires no card and does not start a paid subscription automatically. Subscription charges, receipts, renewal and cancellation are managed through Paddle. Review the actual checkout terms before purchasing. Cancellation takes effect as specified in the billing portal.</p><h2>Customer deposits</h2><p>Service deposits are processed through the detailing business's Square account. Processor fees and provider terms apply separately. Cancelling an appointment does not automatically refund a deposit. The business must review and handle refunds, disputes and service-related complaints.</p><h2>Availability and changes</h2><p>Appointment availability is checked when a reservation is created. A temporary reservation may expire before payment. Late or conflicting payments require business review rather than automatic confirmation. Emails and third-party payment services can fail or be delayed; monitor the dashboard.</p><h2>Acceptable use</h2><p>Do not misuse customer data, upload unlawful material, attempt to access another business's records, interfere with the service, evade payment, or send unsolicited communications through the service. Accounts may be suspended for abuse, security risks or unpaid subscriptions.</p><h2>Account closure and data</h2><p>Business owners may export records and request deletion. Resolve upcoming bookings, pending payments and active subscriptions before account closure. Provider records and backups are subject to their separate retention arrangements.</p><h2>Operator review required</h2><p>These pre-launch terms do not establish a finalized jurisdiction, liability allocation, dispute mechanism or service-level agreement. The operator must obtain appropriate review and publish completed terms, legal identity, refund policy and data-processing information before taking live subscriptions.</p>`}</main>${footer()}</div>`;}
