function renderWizard(){const w=S.wizard,s=w.shop.settings;const title=w.manual?'Add a phone booking':w.quote_token?'Your custom quote is ready.':(w.shop.branding?.headline||'A fresh start for your car.');const steps=w.condition==='heavy'?['Your detail','Your details']:['Your detail','Pick a time','Your details'];const effective=w.condition==='heavy'&&w.step===3?2:w.step;const businessMark=w.shop.name[0];const layout=`${w.shop.demo?'<div class="demo-flag">You are exploring a sample business. All bookings and payments here are demonstrations.</div>':''}${w.manual?'<div class="notice amber mb16">Manual request: review and approve this job after saving it. Approval triggers the customer email and any applicable Square deposit link.</div>':''}<div class="booking-intro"><h1>${e(title)}</h1><p>${w.manual?'Record the details, then approve the requested time.':e(w.shop.branding?.introduction||s.tagline)}</p></div><div class="steps">${steps.map((label,i)=>`${i?'<span class="step-line"></span>':''}<div class="step ${effective===i+1?'active':effective>i+1?'done':''}"><span>${effective>i+1?'✓':i+1}</span>${label}</div>`).join('')}</div><div class="booking-layout"><section id="wizard-content">${wizardStep()}</section><aside id="wizard-summary" class="summary">${wizardSummary()}</aside></div>`;if(w.manual){$('#main').innerHTML=layout;return;}applyBrandDocument(w.shop);$('#app').innerHTML=`<div class="booking-page" style="${brandStyle(w.shop)}">${w.preview?'<div class="brand-preview-banner"><span><strong>Draft preview.</strong> No real bookings or payments. Changes are not live until published.</span><button class="btn small" data-action="brand-return">Back to editor</button></div>':''}${businessHeader(w.shop)}${businessCover(w.shop)}<main id="main" class="booking-main">${layout}</main>${businessFooter(w.shop)}</div>`;}
function wizardStep(){const w=S.wizard,s=w.shop.settings;if(w.step===1)return `<div class="booking-section"><h2>First, where are we heading?</h2><div class="field"><label for="booking-zip">Your five-digit ZIP code</label><input id="booking-zip" data-wfield="zip" inputmode="numeric" maxlength="5" pattern="[0-9]{5}" value="${e(w.zip)}" placeholder="e.g. ${e(s.zip_codes[0])}" autocomplete="postal-code"><small>US addresses only. We validate the ZIP and your detailer's service area.</small></div></div><div class="booking-section"><h2>Choose your service</h2>${s.packages.map(p=>`<button class="option-card ${w.package_id===p.id?'selected':''}" data-action="wizard-package" data-value="${e(p.id)}" aria-pressed="${w.package_id===p.id}"><span class="radio"></span><div class="grow"><h3>${e(p.name)}</h3><p>${e(p.description)}<br>${duration(resolvedRate(p,s.vehicles.find(v=>v.id===w.vehicle_id)||s.vehicles[0]).minutes)} before extras</p></div><span class="amount">${money(resolvedRate(p,s.vehicles.find(v=>v.id===w.vehicle_id)||s.vehicles[0]).price)}</span></button>`).join('')}</div><div class="booking-section"><h2>What are you driving?</h2><div class="vehicle-grid">${s.vehicles.map((v,i)=>`<button class="vehicle-option ${w.vehicle_id===v.id?'selected':''}" data-action="wizard-vehicle" data-value="${e(v.id)}" aria-pressed="${w.vehicle_id===v.id}">${icon(i===2?'truck':'car')}<strong>${e(v.name)}</strong><span>${money(resolvedRate(s.packages.find(p=>p.id===w.package_id)||s.packages[0],v).price)} service</span></button>`).join('')}</div></div>${s.extras.length?`<div class="booking-section"><h2>Anything extra?</h2>${s.extras.map(x=>`<label class="extra-item"><input type="checkbox" data-wextra="${e(x.id)}" ${w.extra_ids.includes(x.id)?'checked':''}><span class="grow">${e(x.name)}<br><small>+ ${x.minutes} min</small></span><strong>+${money(x.price)}</strong></label>`).join('')}</div>`:''}<div class="booking-section"><h2>A quick condition check</h2><label class="check-row"><input type="checkbox" data-wcondition ${w.condition==='heavy'?'checked':''}><span>My vehicle needs special attention: heavy soiling, severe staining or excessive pet hair.<small style="display:block;margin-top:5px;color:var(--muted)">We'll ask for details and photos so the business can quote accurately.</small></span></label></div><div id="wizard-error">${w.priceError?`<div class="notice error">${e(w.priceError)}</div>`:''}</div><div class="booking-buttons"><span class="muted small">Clear pricing. No surprises.</span>${btn(w.condition==='heavy'?'Request a reviewed quote '+icon('arrow'):'Choose a time '+icon('arrow'),'wizard-next','primary',!w.price&&w.condition!=='heavy'?'disabled':'')}</div>`;if(w.step===2)return `${w.offer?`<div class="notice mb16">${e(w.offer.message)}<br><strong>${money(w.offer.amount)} subtotal · ${duration(w.offer.minutes)}</strong></div>`:''}<div class="booking-section"><h2>Find a time that works.</h2><p class="muted small">Appointments are shown in ${e(s.timezone.replaceAll('_',' '))}, regardless of your current location.</p><div class="field mt24"><label for="booking-date">Appointment date</label><input id="booking-date" type="date" data-wdate value="${w.date}" min="${todayISO(s.timezone)}" max="${addDays(todayISO(s.timezone),s.horizon_days)}"></div><div class="date-pills">${Array.from({length:8},(_,i)=>{const day=addDays(todayISO(s.timezone),i);return `<button class="date-pill ${day===w.date?'selected':''}" data-action="wizard-date" data-value="${day}"><span>${new Intl.DateTimeFormat('en-US',{weekday:'short',timeZone:'UTC'}).format(new Date(day+'T12:00Z'))}</span><strong>${parseInt(day.slice(-2))}</strong></button>`;}).join('')}</div><div id="slot-options">${slotMarkup()}</div></div><div class="notice mt24">${icon('clock')} ${w.price?duration(w.price.minutes):''} of service, with time reserved afterward for the detailer's travel buffer.</div><div class="booking-buttons">${w.quote_token?'<span></span>':btn(icon('left')+' Back','wizard-back')}${btn('Your details '+icon('arrow'),'wizard-next','primary',w.start_ts?'':'disabled')}</div>`;const c=w.customer;return `<form data-form="wizard-details"><h2 style="font-size:18px;margin-bottom:22px">${w.condition==='heavy'?'Tell us a little more.':'A few details, and you’re set.'}</h2><div class="form-grid">${field('Full name','customer_name',c.customer_name||'','text','required minlength="2" maxlength="80" autocomplete="name"')}${field('Email address','email',c.email||'','email',`required autocomplete="email" ${w.quote_token?'readonly':''}`)}${field('State (two-letter code)','state',c.state||'','text','required minlength="2" maxlength="2" pattern="[A-Za-z]{2}" autocomplete="address-level1" placeholder="TX"')}${field('Country','country','United States','text','readonly')}${field('Phone number','phone',c.phone||'','tel','required minlength="10" maxlength="25" autocomplete="tel"')}${field('Vehicle year, make & model','vehicle_notes',c.vehicle_notes||'','text','maxlength="160" placeholder="e.g. 2022 Toyota RAV4"')}<div class="full">${field('Service address','address',c.address||'','text','required minlength="8" maxlength="220" autocomplete="street-address" placeholder="Street, city and state"')}</div><div class="field full"><label for="customer-notes">Anything else we should know?</label><textarea id="customer-notes" name="notes" maxlength="1500" placeholder="Parking instructions, condition details, or a question...">${e(c.notes||'')}</textarea></div>${w.condition==='heavy'?'<div class="full">'+photoPicker('quote')+'</div>':'<p class="full muted small">You can add car photos from your private booking link after your appointment is confirmed.</p>'}${s.requires_water?`<label class="check-row full"><input name="has_water" type="checkbox" ${c.has_water?'checked':''} required><span>I can provide access to water at the service location.</span></label>`:''}${s.requires_power?`<label class="check-row full"><input name="has_power" type="checkbox" ${c.has_power?'checked':''} required><span>I can provide access to a power outlet.</span></label>`:''}</div><div class="honeypot" aria-hidden="true"><input name="website" tabindex="-1" autocomplete="off"></div><div class="notice mt24" style="background:#f5f7f1;color:#76826e">${e(s.cancellation_policy)}</div><label class="check-row mt16"><input type="checkbox" name="accepted_policy" required><span>I agree to this business's cancellation policy and confirm the booking details are accurate.</span></label><div class="booking-buttons">${btn(icon('left')+' Back','wizard-back')}<button class="btn primary" type="submit">${w.condition==='heavy'?'Send quote request':'Send booking request'} ${icon('arrow')}</button></div><p class="muted small mt16">${w.condition==='heavy'?'No time is reserved and no payment is taken for a quote request.':'This is a request, not a confirmed appointment. The detailer must approve it before any confirmation or payment link is sent. No payment is taken now.'}</p></form>`;}
function wizardSummary(){const w=S.wizard,p=w.price,s=w.shop.settings;const pkg=s.packages.find(x=>x.id===w.package_id),v=s.vehicles.find(x=>x.id===w.vehicle_id);return `<h2>Your detail</h2><div class="summary-detail"><strong>${e(w.quote_token?'Custom detail':pkg?.name||'Choose a service')}</strong><br><small>${e(v?.name||'')} ${w.zip?'· '+e(w.zip):''}</small>${w.start_ts?`<div class="row mt16">${icon('calendar')}<div>${inZone(w.start_ts,s.timezone,{month:'short',day:'numeric'})}<br><small>${inZone(w.start_ts,s.timezone,{hour:'numeric',minute:'2-digit',timeZoneName:'short'})}</small></div></div>`:''}</div>${w.condition==='heavy'?'<p class="muted small">A reviewed quote is needed. The business will confirm price and duration before you choose an appointment.</p>':p?`<div class="money-lines">${p.lines.map(l=>`<div><span>${e(l.name)}</span><span>${money(l.amount)}</span></div>`).join('')}<div><span>Tax</span><span>${money(p.tax)}</span></div><div class="total"><span>Total</span><span>${money(p.total)}</span></div></div><div class="deposit-box"><span>${s.payment_method==='in_person'?'Online payment':'Deposit after approval'}</span><strong>${s.payment_method==='in_person'?'None':money(p.deposit)}</strong></div><p class="summary-note">${s.payment_method==='in_person'?'Pay the detailer in person. Your request must be approved first.':'No payment is taken when requesting. After approval, the detailer sends a Square link for any deposit.'}</p>`:`<p class="muted small">Enter your ZIP code to check availability and see your complete price.</p>`}<hr><div class="row" style="align-items:flex-start;color:#8c9884;font-size:10px">${icon('shield')}<p>${w.shop.demo?'Demo experience. No real money moves.':'Prices set by the detailer. Kontracts takes no booking commission.'}</p></div>`;}
async function priceWizard(){const w=S.wizard;if(!w)return;const generation=++w.version;w.priceError='';if(w.zip.length!==5){w.price=null;updateWizardPrice();return;}if(w.condition==='heavy'){w.price=null;w.priceError=w.shop.settings.zip_codes.includes(w.zip)?'':'That ZIP code is outside this business’s service area.';updateWizardPrice();return;}try{const result=await api(wizardBase()+'/price',{method:'POST',body:selection()});if(generation!==w.version)return;w.price=result;}catch(err){if(generation!==w.version)return;w.price=null;w.priceError=err.message;}updateWizardPrice();}
function updateWizardPrice(){const w=S.wizard;if(!w)return;const summary=$('#wizard-summary');if(summary)summary.innerHTML=wizardSummary();const error=$('#wizard-error');if(error)error.innerHTML=w.priceError?`<div class="notice error">${e(w.priceError)}</div>`:'';const next=$('[data-action="wizard-next"]');if(next&&w.step===1)next.disabled=w.condition==='heavy'?w.zip.length!==5||Boolean(w.priceError):!w.price;}
function slotMarkup(){const w=S.wizard;if(w.slotsLoading)return skeleton();if(w.slotsError)return `<div class="notice error">${e(w.slotsError)}</div>`;return w.slots.length?`<div class="slots">${w.slots.map(x=>`<button class="slot ${x.start_ts===w.start_ts?'selected':''}" data-action="wizard-slot" data-value="${x.start_ts}" aria-pressed="${x.start_ts===w.start_ts}">${e(x.label)}</button>`).join('')}</div>`:empty('A different day, perhaps?','No available times fit this service on the selected date. Try another day.','calendar');}
async function loadSlots(){const w=S.wizard;w.slotsLoading=true;w.slotsError='';const selected=w.date;const node=$('#slot-options');if(node)node.innerHTML=slotMarkup();try{const result=await api(wizardBase()+'/slots',{method:'POST',body:{...selection(),date:selected}});if(selected!==w.date)return;w.slots=result.slots;}catch(err){w.slots=[];w.slotsError=err.message;}finally{if(selected===w.date){w.slotsLoading=false;const n=$('#slot-options');if(n)n.innerHTML=slotMarkup();}}}
async function submitWizard(form){const w=S.wizard;if(w.preview)throw new Error('This is a draft preview. No booking or payment can be created here. Publish and open your live page to book.');const fd=new FormData(form);const customer={country:'US',state:fd.get('state')||'',customer_name:fd.get('customer_name'),email:fd.get('email'),phone:fd.get('phone'),address:fd.get('address'),vehicle_notes:fd.get('vehicle_notes'),notes:fd.get('notes'),has_water:fd.has('has_water'),has_power:fd.has('has_power')};w.customer=customer;if(w.condition==='heavy'){const data={...selection(),...customer,website:fd.get('website')||''};delete data.has_water;delete data.has_power;const request=new FormData();request.append('data',JSON.stringify(data));if(PhotoState.busy)throw new Error('Wait for your photos to finish optimizing.');const photos=w.photos||[];if(photos.length>3)throw new Error('Choose no more than three photos.');for(const f of photos)request.append('photos',f.file);const result=await api('/public/shops/'+w.shop.slug+'/quote-requests',{method:'POST',body:request});for(const p of w.photos)URL.revokeObjectURL(p.src);w.photos=[];$('#wizard-content').innerHTML=`<div class="card">${empty('Your request is on its way.',result.message,'check')}</div>`;return;}if(!w.submission)w.submission={...selection(),...customer,start_ts:w.start_ts,idempotency_key:w.idempotency_key,accepted_policy:true,website:fd.get('website')||''};const result=await api(w.manual?'/bookings':'/public/shops/'+w.shop.slug+'/book',{method:'POST',body:w.submission});if(w.manual){toast('Request saved. Open the job to approve it and notify the customer.');go('/app/bookings');}else if(result.checkout_url&&result.status==='held'){if(result.checkout_url.startsWith('/'))go(result.checkout_url);else window.__previewAssign(result.checkout_url);}else go(result.manage_url);}
async function renderManage(raw){const data=await api('/public/manage/'+encodeURIComponent(raw));S.manage={...data,token:raw};const b=data.booking,s=data.shop.settings;const title={pending_approval:'Your request is with the detailer.',awaiting_signature:'Your invoice is ready to sign.',confirmed:'You’re on the calendar.',completed:'All fresh. All finished.',held:'One last step: your deposit.',expired:'This reservation has expired.',cancelled:'Your booking is cancelled.',payment_review:'Payment received. Review needed.',no_show:'This appointment was marked no-show.'}[b.status]||'Your booking';const message={pending_approval:'No appointment is confirmed and no payment has been taken. The detailer will review your request and email you after approval. Requests expire after 48 hours or the requested start time.',awaiting_signature:'The detailer has signed your invoice. Check your email for the private invoice link, review the PDF and sign it to finish this job.',confirmed:'Your appointment is confirmed. We’ll send your details by email.',held:'Your selected time is temporarily reserved. Complete the deposit before the reservation expires.',expired:'No appointment is confirmed. Please contact the business or start a new booking.',cancelled:'Your appointment has been released. Refunds are reviewed separately by the business.',payment_review:'Your payment was received after the time was unavailable. No appointment is confirmed. Contact the business to reschedule or arrange a refund.',completed:'Thanks for choosing '+data.shop.name+'.'}[b.status]||'Contact the business with any questions.';applyBrandDocument(data.shop);$('#app').innerHTML=`<div class="booking-page" style="${brandStyle(data.shop)}">${businessHeader(data.shop,'Your booking')}<main id="main" class="booking-manage"><div class="success-head"><span class="badge-icon">${icon(b.status==='confirmed'||b.status==='completed'?'check':b.status==='held'?'card':'help')}</span><h1>${title}</h1><p>${e(message)}</p></div>${b.status==='held'?`<div class="notice amber mb16">Reservation expires at ${inZone(b.hold_until,s.timezone,{hour:'numeric',minute:'2-digit',timeZoneName:'short'})}. A checkout return alone does not confirm payment.</div>`:''}<div class="card card-pad"><div class="row between"><h3>${e(b.snapshot.service)}</h3>${statusBadge(b.status)}</div><div class="detail-grid"><div><label>When</label><p>${inZone(b.start_ts,s.timezone,{weekday:'long',month:'short',day:'numeric'})}<br>${inZone(b.start_ts,s.timezone,{hour:'numeric',minute:'2-digit',timeZoneName:'short'})}</p></div><div><label>How long</label><p>${duration(b.snapshot.minutes)}</p></div><div><label>Vehicle</label><p>${e(b.vehicle_notes||b.snapshot.vehicle)}</p></div><div><label>Where</label><p>${e(b.address)}</p></div></div><p class="muted small mt16">${b.payment_method==='square'?'Payments go to your detailer through Square.':'Pay your detailer in person. No online payment link is needed.'}</p><hr><div class="money-lines"><div><span>Service total</span><strong>${money(b.total)}</strong></div><div><span>Deposit</span><span>${money(b.deposit)} · ${e(b.payment_status.replaceAll('_',' '))}</span></div>${b.refunded?`<div><span>Refunded</span><strong>${money(b.refunded)}</strong></div>`:''}</div><div class="modal-actions">${b.status==='held'?btn('Continue to Square deposit','deposit-pay','primary',`data-token="${e(raw)}"`)+btn('Check payment status','manage-refresh',''):''}${data.can_change?`${btn(icon('calendar')+' Reschedule','customer-reschedule-open')}${btn('Cancel booking','customer-cancel','danger')}`:''}${b.status==='confirmed'?`<a href="/api/public/manage/${e(raw)}/calendar.ics" class="btn">${icon('download')} Add to calendar</a>`:''}</div></div><div id="customer-photos" class="card card-pad mt24"></div><div class="card card-pad mt24"><h3>Questions or changes?</h3><p class="muted small mt8">${e(s.cancellation_policy)}</p><div class="row wrap mt16"><a class="btn small" href="mailto:${e(data.shop.correspondence_email||S.config.support_email)}">${icon('mail')} Contact the business</a>${s.phone?`<span class="muted small">${e(s.phone)}</span>`:''}</div></div><p class="muted small mt24">Keep this private booking link safe. Anyone with the link can view this booking and make eligible changes.</p></main>${businessFooter(data.shop)}</div>`;await customerPhotoPanel(raw);if(b.status==='held'){clearTimeout(S.pollTimer);S.pollTimer=setTimeout(async()=>{if(window.__previewURL.pathname==='/manage/'+raw)try{await renderManage(raw);}catch{}},7000);}}
async function renderDemoCheckout(raw){const data=await api('/public/manage/'+raw);$('#app').innerHTML=`<main id="main" class="booking-manage">${brand()}<div class="card card-pad mt32"><span class="pill amber">Simulation only</span><h1 class="mt24">Try the deposit flow.</h1><p class="muted mt16">This is a local demonstration, not Square checkout. No real card details are needed, and no money will move.</p><div class="price-large mt24">${money(data.booking.deposit)}</div><p class="muted small">Simulated booking deposit for ${e(data.shop.name)}.</p>${btn('Simulate a successful deposit '+icon('check'),'demo-pay','primary wide mt24',`data-token="${e(raw)}"`)}${nav('Back to booking','/manage/'+raw,'btn wide mt16')}</div></main>`;}
async function openPaddle(){if(!S.config.paddle_client_token){$('#checkout-status').innerHTML='<div class="notice amber">The platform operator must configure a Paddle client token before subscription checkout is available.</div>';return;}const tx=new URLSearchParams(window.__previewURL.search).get('_ptxn');if(!tx||!/^txn_[a-z0-9]+$/.test(tx)){throw new Error('This checkout link is invalid. Open a new checkout from Subscription.');}await new Promise((resolve,reject)=>{if(window.Paddle)return resolve();const script=document.createElement('script');script.src='https://cdn.paddle.com/paddle/v2/paddle.js';script.onload=resolve;script.onerror=()=>reject(new Error('Paddle checkout could not load. Please try again.'));document.head.appendChild(script);});if(S.config.paddle_environment==='sandbox')Paddle.Environment.set('sandbox');Paddle.Initialize({token:S.config.paddle_client_token,eventCallback:event=>{if(event.name==='checkout.completed'){toast('Payment submitted. Your subscription updates after provider verification.');go('/app/billing');}}});Paddle.Checkout.open({transactionId:tx,settings:{theme:'light',displayMode:'overlay',successUrl:'https://preview.invalid'+'/app/billing'}});}
async function refreshMe(){S.me=await api('/auth/me');}
async function persistSettings(settings){await api('/settings',{method:'PUT',body:settings});S.dirty=false;await refreshMe();toast('Saved. New bookings will use these settings.');}
function cents(value){const str=String(value).trim();if(!/^\d+(\.\d{1,2})?$/.test(str))throw new Error('Enter a positive amount with no more than two decimal places.');return Math.round(Number(str)*100);}
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('Link copied.');}catch{openModal('Your link',`<p class="muted small mb16">Copy this link to share it.</p><input readonly value="${e(text)}" aria-label="Link to copy">`);$('input',$('#modal')).select();}}
function serviceEditor(kind,index){const list=kind==='package'?'packages':kind==='extra'?'extras':'vehicles';const x=S.me.shop.settings[list][index]||{name:'',description:'',price:0,minutes:kind==='package'?90:0,active:true};openModal(`${index<0?'Add':'Edit'} ${kind}`,`<form data-form="service-edit" data-dirty data-kind="${kind}" data-index="${index}">${field('Name','name',x.name,'text','required minlength="2" maxlength="60"')}${kind==='package'?`<div class="field mt16"><label for="service-description">Description</label><textarea id="service-description" name="description" maxlength="300">${e(x.description)}</textarea></div>`:''}<div class="form-grid mt16">${field(kind==='vehicle'?'Default adjustment (USD)':kind==='package'?'Base price (USD)':'Price (USD)','price',(x.price/100).toFixed(2),'number',`required min="${kind==='package'?1:0}" step="0.01" max="10000"`)}${field('Duration / extra time (minutes)','minutes',x.minutes,'number',`required min="${kind==='package'?30:0}" max="${kind==='package'?600:kind==='vehicle'?180:240}"`)}</div>${kind==='package'?'<p class="muted small mt16">Base price applies with the vehicle default unless you set an individual price. Existing individual prices are kept.</p>':''}${kind!=='vehicle'?`<label class="check-row mt24"><input name="active" type="checkbox" ${x.active?'checked':''}><span>Visible to customers</span></label>`:''}<div class="form-footer"><button class="btn primary" type="submit">Save ${kind}</button></div></form>`);}
async function showBlocks(){const result=await api('/blocks');const n=$('#blocks-list');if(n)n.innerHTML=result.blocks.length?result.blocks.map(b=>`<div class="row between" style="padding:12px 0;border-bottom:1px solid var(--line)"><div><strong class="small">${e(b.label)}</strong><p class="muted small">${dateLabel(b.start_ts,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})} — ${dateLabel(b.end_ts,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</p></div><button class="icon-btn" data-action="block-delete" data-id="${e(b.id)}" aria-label="Delete blocked time">${icon('trash')}</button></div>`).join(''):'<p class="muted small">No upcoming blocked time.</p>';}
async function rescheduleModal(kind,key){S.reschedule={kind,key};const zone=kind==='customer'?S.manage.shop.settings.timezone:S.me.shop.settings.timezone;const date=todayISO(zone);openModal('Find a new time',`<p class="muted small mb16">Times are in ${e(zone)}. Your deposit stays with the booking.</p><form data-form="reschedule"><div class="field"><label for="reschedule-date">New date</label><input id="reschedule-date" type="date" data-reschedule-date name="date" value="${date}" min="${date}" required></div><div id="reschedule-slots" class="mt16">${skeleton()}</div><div class="form-footer"><button class="btn primary" type="submit">Confirm new time</button></div></form>`);await loadRescheduleSlots(date);}
async function loadRescheduleSlots(date){const r=S.reschedule;const path=r.kind==='customer'?'/public/manage/'+r.key:'/bookings/'+r.key;try{const result=await api(path+'/slots?date='+date);if(!$('#reschedule-slots'))return;$('#reschedule-slots').innerHTML=result.slots.length?`<div class="slots">${result.slots.map(x=>`<label class="slot check-row"><input type="radio" name="start_ts" value="${x.start_ts}" required><span>${e(x.label)}</span></label>`).join('')}</div>`:'<div class="notice">No times fit on this day. Please choose another date.</div>';}catch(err){$('#reschedule-slots').innerHTML=`<div class="notice error">${e(err.message)}</div>`;}}
async function action(name,node){if(await workflowAction(name,node))return;if(await releaseAction(name,node))return;if(name==='brand-return'){go('/app/branding');return;}if(name.startsWith('brand-'))return brandingAction(name,node);const value=node.dataset.value,id=node.dataset.id;switch(name){case'quote-photo-delete':if(confirm('Delete this quote photo from active storage?')){toast((await api('/photos/'+node.dataset.id,{method:'DELETE'})).message);await renderPage();}break;case'photos-choose-job':await choosePhotoJob();break;case'photos-open':await openJobPhotos(node.dataset.id);break;case'photos-save':await saveJobPhotos();break;case'photos-filter':PhotoState.filter=value;$('#main').innerHTML=renderPhotoLibrary();break;case'photo-view':viewPhoto(node.dataset.id);break;case'photo-delete':await deleteJobPhoto(node.dataset.id);break;case'photos-customer-open':await openCustomerPhotos(node.dataset.token);break;case'modal-close':closeModal();break;case'menu':$('.shell')?.classList.toggle('menu-open');break;case'reload':await render();break;case'enter-demo':{const r=await api('/auth/demo',{method:'POST'});S.me={csrf:r.csrf};go('/app');break;}case'logout':await api('/auth/logout',{method:'POST'});S.me=null;go('/login');break;case'copy-booking-link':await copyText(S.me.shop.booking_url||'https://preview.invalid'+'/book/'+S.me.shop.slug);break;case'copy-customer-link':await copyText((await api('/bookings/'+id+'/link')).url);break;case'booking-open':bookingModal(id);break;case'booking-view':S.bookingView=value;$('#main').innerHTML=bookingsPage();break;case'week-back':S.week=addDays(S.week||todayISO(S.me.shop.settings.timezone),-7);$('#main').innerHTML=bookingsPage();break;case'week-next':S.week=addDays(S.week||todayISO(S.me.shop.settings.timezone),7);$('#main').innerHTML=bookingsPage();break;case'booking-action':if(value==='cancel'&&!confirm('Cancel this appointment? The time will be released. This does not refund a deposit.'))break;await api('/bookings/'+id+'/action',{method:'POST',body:{action:value}});closeModal();toast(value==='cancel'?'Booking cancelled. Refunds are separate.':'Booking updated.');await renderPage();break;case'refund-open':openModal('Refund the deposit?',`<p>This sends a refund request to the payment provider. It does not cancel the appointment.</p><p class="muted small mt16">Check your cancellation policy and customer agreement before proceeding. This action cannot be automatically undone.</p><div class="modal-actions">${btn('Keep deposit','modal-close')}${btn('Yes, refund the deposit','refund-confirm','danger',`data-id="${e(id)}"`)}</div>`);break;case'refund-confirm':{const r=await api('/bookings/'+id+'/refund',{method:'POST',body:{confirmation:'REFUND DEPOSIT'}});closeModal();toast(r.status==='refunded'?'Deposit refunded.':'Refund submitted. Awaiting provider confirmation.');await renderPage();break;}case'reschedule-open':await rescheduleModal('owner',id);break;case'quote-offer':{const q=S.quotes.find(x=>x.id===id);openModal('Prepare a custom quote',`<p class="muted small mb16">${e(q.customer_name)} · ${e(q.vehicle_notes||q.vehicle)}</p><form data-form="quote-offer" data-id="${e(id)}"><div class="form-grid">${field('Service subtotal (USD)','amount',q.amount?(q.amount/100).toFixed(2):'','number','required min="1" max="10000" step="0.01"')}${field('Service duration (minutes)','minutes',q.minutes||180,'number','required min="30" max="600"')}</div><div class="field mt16"><label for="quote-message">Message to your customer</label><textarea id="quote-message" name="message" required minlength="5" maxlength="1000">${e(q.message||'Thanks for the details. Here is your custom quote. Choose an available time using the link below.')}</textarea></div><p class="muted small mt16">The quote is valid for 7 days. Your configured tax and deposit rules are shown before the customer books.</p><div class="form-footer"><button class="btn primary" type="submit">Send quote ${icon('arrow')}</button></div></form>`);break;}case'quote-decline':if(!confirm('Decline this request and notify the customer?'))break;await api('/quotes/'+id+'/decline',{method:'POST'});toast('Customer notified.');await renderPage();break;case'package-edit':serviceEditor('package',Number(node.dataset.index));break;case'extra-edit':serviceEditor('extra',Number(node.dataset.index));break;case'vehicle-edit':serviceEditor('vehicle',Number(node.dataset.index));break;case'settings-tab':if(S.dirty&&!confirm('Discard your unsaved settings changes?'))break;S.dirty=false;S.settingsTab=value;$('#main').innerHTML=settingsPage();break;case'publish':await api('/publish',{method:'POST',body:{published:value==='true'}});await refreshMe();toast(value==='true'?'Your booking page is live.':'Your booking page is unpublished.');renderShell(window.__previewURL.pathname);await renderPage();break;case'resend-verification':toast((await api('/auth/resend-verification',{method:'POST'})).message);break;case'verify-email':toast((await api('/auth/verify-email',{method:'POST',body:{token:new URLSearchParams(window.__previewURL.search).get('token')||''}})).message);go('/app/settings');break;case'block-open':{const date=todayISO(S.me.shop.settings.timezone);openModal('Block time off',`<p class="muted small mb16">${e(S.me.shop.settings.timezone)}. Existing appointments must be rescheduled first.</p><form data-form="block">${field('Label','label','','text','required minlength="2" maxlength="80" placeholder="e.g. Personal appointment"')}<div class="form-grid mt16">${field('Start date','start_date',date,'date','required')}${field('Start time','start_time','09:00','time','required')}${field('End date','end_date',date,'date','required')}${field('End time','end_time','12:00','time','required')}</div><div class="form-footer"><button class="btn primary" type="submit">Block this time</button></div></form>`);break;}case'blocks-load':await showBlocks();break;case'block-delete':if(confirm('Remove this blocked time?')){await api('/blocks/'+id,{method:'DELETE'});await showBlocks();toast('Time is available again.');}break;case'square-connect':window.__previewAssign((await api('/integrations/square/connect',{method:'POST'})).url);break;case'square-disconnect':if(confirm('Disconnect Square and unpublish your booking page?')){toast((await api('/integrations/square/disconnect',{method:'POST'})).message);await refreshMe();await renderPage();}break;case'billing-checkout':window.__previewAssign((await api('/billing/checkout',{method:'POST'})).url);break;case'billing-portal':window.__previewAssign((await api('/billing/portal',{method:'POST'})).url);break;case'retry-emails':toast((await api('/operations/retry-emails',{method:'POST'})).message);await renderPage();break;case'delete-account-open':openModal('Permanently delete this account?',`<p class="notice error mb16">This removes your active application records. Export your data first. Upcoming bookings and active subscriptions must be resolved.</p><form data-form="delete-account">${field('Confirm your password','password','','password','required autocomplete="current-password"')}<div class="form-footer"><button class="btn danger" type="submit">Delete my account permanently</button></div></form>`);break;case'wizard-package':S.wizard.package_id=value;S.wizard.start_ts=null;S.wizard.submission=null;await priceWizard();renderWizard();break;case'wizard-vehicle':S.wizard.vehicle_id=value;S.wizard.start_ts=null;S.wizard.submission=null;await priceWizard();renderWizard();break;case'wizard-next':if(S.wizard.step===1){await priceWizard();if(S.wizard.zip.length!==5||S.wizard.priceError)throw new Error(S.wizard.priceError||'Enter a valid five-digit ZIP code.');if(S.wizard.condition==='heavy'){S.wizard.step=3;renderWizard();}else{if(!S.wizard.price)throw new Error('Choose a valid service first.');S.wizard.step=2;renderWizard();await loadSlots();}}else{if(!S.wizard.start_ts)throw new Error('Choose an appointment time.');S.wizard.step=3;renderWizard();}window.scrollTo({top:0,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});break;case'wizard-back':{const form=$('[data-form="wizard-details"]');if(form){const fd=new FormData(form);S.wizard.customer={...S.wizard.customer,...Object.fromEntries(fd.entries()),has_water:fd.has('has_water'),has_power:fd.has('has_power')};}if(S.wizard.submission)throw new Error('A reservation attempt already exists. Retry the same submission or contact the business before making a new booking.');S.wizard.step=S.wizard.condition==='heavy'?1:Math.max(1,S.wizard.step-1);renderWizard();if(S.wizard.step===2)await loadSlots();break;}case'wizard-date':S.wizard.date=value;S.wizard.start_ts=null;renderWizard();await loadSlots();break;case'wizard-slot':S.wizard.start_ts=Number(value);$('#slot-options').innerHTML=slotMarkup();$('#wizard-summary').innerHTML=wizardSummary();$('[data-action="wizard-next"]').disabled=false;break;case'demo-pay':{const result=await api('/demo-checkout/'+node.dataset.token,{method:'POST'});go(result.url);break;}case'manage-refresh':await renderManage(S.manage.token);break;case'customer-cancel':if(confirm('Cancel your appointment? Any deposit refund is reviewed separately by the business.')){toast((await api('/public/manage/'+S.manage.token+'/cancel',{method:'POST'})).message);await renderManage(S.manage.token);}break;case'customer-reschedule-open':await rescheduleModal('customer',S.manage.token);break;default:console.warn('Unknown action',name);}}
async function submit(form){if(await workflowSubmit(form))return;if(await releaseSubmit(form))return;if(['branding','booking-slug','brand-domain'].includes(form.dataset.form))return brandingSubmit(form);const fd=new FormData(form),data=Object.fromEntries(fd.entries()),type=form.dataset.form;switch(type){case'photo-edit':await editJobPhoto(form);break;case'login':{const result=await api('/auth/login',{method:'POST',body:data});S.me={csrf:result.csrf};go('/app');break;}case'register':{data.accepted_terms=fd.has('accepted_terms');const r=await api('/auth/register',{method:'POST',body:data});S.me={csrf:r.csrf};toast(r.message);go('/app/setup');break;}case'forgot':toast((await api('/auth/forgot-password',{method:'POST',body:data})).message);break;case'reset':toast((await api('/auth/reset-password',{method:'POST',body:{token:new URLSearchParams(window.__previewURL.search).get('token')||'',password:data.password}})).message);go('/login');break;case'settings-business':{const s=structuredClone(S.me.shop.settings);Object.assign(s,{name:data.name,city:data.city,tagline:data.tagline,phone:data.phone,contact_email:data.contact_email,timezone:data.timezone,zip_codes:data.zip_codes.split(/[\s,]+/).filter(Boolean),requires_water:fd.has('requires_water'),requires_power:fd.has('requires_power')});await persistSettings(s);await render();break;}case'settings-schedule':{const s=structuredClone(S.me.shop.settings);s.hours=s.hours.map((_,i)=>({enabled:fd.has('day-'+i),start:data['start-'+i],end:data['end-'+i]}));for(const key of ['buffer_minutes','lead_hours','horizon_days'])s[key]=Number(data[key]);await persistSettings(s);await renderPage();break;}case'settings-payments':{const s=structuredClone(S.me.shop.settings);s.deposit_percent=Number(data.deposit_percent);s.tax_basis_points=cents(data.tax_rate);await persistSettings(s);await renderPage();break;}case'settings-policy':{const s=structuredClone(S.me.shop.settings);s.cancellation_hours=Number(data.cancellation_hours);s.cancellation_policy=data.cancellation_policy;s.policy_reviewed=fd.has('policy_reviewed');await persistSettings(s);await renderPage();break;}case'service-edit':{const s=structuredClone(S.me.shop.settings),kind=form.dataset.kind,index=Number(form.dataset.index),key=kind==='package'?'packages':kind==='extra'?'extras':'vehicles';const item={id:index<0?'item-'+crypto.randomUUID().slice(0,8):s[key][index].id,name:data.name,price:cents(data.price),minutes:Number(data.minutes)};if(kind==='package'){item.description=data.description;item.vehicle_rates=index<0?{}:s[key][index].vehicle_rates||{};}if(kind!=='vehicle')item.active=fd.has('active');if(index<0)s[key].push(item);else s[key][index]=item;await persistSettings(s);closeModal();await renderPage();break;}case'quote-offer':{const result=await api('/quotes/'+form.dataset.id+'/offer',{method:'POST',body:{amount:cents(data.amount),minutes:Number(data.minutes),message:data.message}});closeModal();toast(result.message);await renderPage();break;}case'block':{const zone=S.me.shop.settings.timezone;await api('/blocks',{method:'POST',body:{label:data.label,start_ts:localTimestamp(data.start_date,data.start_time,zone),end_ts:localTimestamp(data.end_date,data.end_time,zone)}});closeModal();toast('Time blocked.');await showBlocks();break;}case'reschedule':{if(!data.start_ts)throw new Error('Select an available time.');const r=S.reschedule;await api((r.kind==='customer'?'/public/manage/'+r.key:'/bookings/'+r.key)+'/reschedule',{method:'POST',body:{start_ts:Number(data.start_ts)}});closeModal();toast('Appointment rescheduled.');if(r.kind==='customer')await renderManage(r.key);else await renderPage();break;}case'wizard-details':await submitWizard(form);break;case'change-password':{const r=await api('/auth/change-password',{method:'POST',body:data});S.me.csrf=r.csrf;toast(r.message);form.reset();break;}case'delete-account':if(!confirm('This is permanent. Delete this account and its active application records?'))break;toast((await api('/account',{method:'DELETE',body:{password:data.password,confirmation:'DELETE MY ACCOUNT'}})).message);closeModal();S.me=null;go('/');break;}}
document.addEventListener('click',async event=>{const link=event.target.closest('a[data-nav]');if(link){const href=link.getAttribute('href');if(href.startsWith('#')||href.startsWith('/api/')||/^https?:/.test(href)||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;event.preventDefault();go(href);return;}const node=event.target.closest('[data-action]');if(!node||node.disabled||node.dataset.running==='true')return;event.preventDefault();node.dataset.running='true';if(node.tagName==='BUTTON'){node.disabled=true;node.classList.add('busy');}try{await action(node.dataset.action,node);}catch(err){toast(err.message,true);}finally{node.dataset.running='false';if(node.tagName==='BUTTON'){node.disabled=false;node.classList.remove('busy');}}});
document.addEventListener('submit',async event=>{const form=event.target;if(!form.dataset.form)return;event.preventDefault();const buttons=$$('button[type="submit"]',form);buttons.forEach(b=>{b.disabled=true;b.classList.add('busy');});$('.form-error',form)?.remove();try{await submit(form);}catch(err){formError(form,err.message);}finally{buttons.forEach(b=>{b.disabled=false;b.classList.remove('busy');});}});
let zipTimer,searchTimer;
document.addEventListener('input',event=>{const n=event.target;if(n.closest('[data-dirty]'))S.dirty=true;if(n.dataset.wfield){S.wizard[n.dataset.wfield]=n.value;S.wizard.start_ts=null;clearTimeout(zipTimer);zipTimer=setTimeout(priceWizard,250);}if(n.dataset.search==='bookings'){S.search=n.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{const cursor=n.selectionStart;$('#main').innerHTML=bookingsPage();const next=$('[data-search="bookings"]');next.focus();next.setSelectionRange(cursor,cursor);},180);}if(n.name==='business'&&n.closest('[data-form="register"]')){const slug=$('[name="slug"]');if(!slug.dataset.touched)slug.value=n.value.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,45);}if(n.name==='slug')n.dataset.touched='true';});
document.addEventListener('change',async event=>{const n=event.target;try{if(n.dataset.wextra){const w=S.wizard;w.extra_ids=n.checked?[...w.extra_ids,n.dataset.wextra]:w.extra_ids.filter(x=>x!==n.dataset.wextra);w.start_ts=null;await priceWizard();}if(n.hasAttribute('data-wcondition')){S.wizard.condition=n.checked?'heavy':'standard';await priceWizard();renderWizard();}if(n.hasAttribute('data-wdate')){S.wizard.date=n.value;S.wizard.start_ts=null;renderWizard();await loadSlots();}if(n.hasAttribute('data-reschedule-date'))await loadRescheduleSlots(n.value);if(n.dataset.filter==='bookings'){S.bookingFilter=n.value;$('#main').innerHTML=bookingsPage();}}catch(err){toast(err.message,true);}});
document.addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ')&&event.target.matches('tr[data-action]')){event.preventDefault();event.target.click();}});
window.addEventListener('beforeunload',event=>{if(S.dirty||BrandState.busy){event.preventDefault();event.returnValue='';}});
window.addEventListener('popstate',()=>{S.dirty=false;closeModal();render();});
$('#modal').addEventListener('cancel',event=>{event.preventDefault();closeModal();});
$('#modal').addEventListener('click',event=>{if(event.target===$('#modal')){const r=event.target.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeModal();}});
render();
</script></body>
